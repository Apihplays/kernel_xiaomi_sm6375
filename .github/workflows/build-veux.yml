# ============================================================================
# Build veux (Redmi Note 11 Pro 5G / SM6375 holi) — 5.4 kernel, PixelOS A17
#
# Self-contained CI mirroring the proven local recipe (build_veux.sh):
#   veux_defconfig -> KALLSYMS_ALL/DEBUG_KERNEL fix -> olddefconfig
#   -> make Image Image.gz dtbs (LLVM 23 clang, all cores)
#   -> verify ReSukiSU hook symbols -> upload artifacts
#
# Toolchain: official LLVM 23.1.0 release — same one used locally
# (LLVM-23.1.0-Linux-X64, ~12 GB extracted). ld.lld links against ICU 70,
# which Ubuntu 24.04 does not ship, so the ICU 70 libs are staged into the
# toolchain's own lib/ (RUNPATH=$ORIGIN/../lib) exactly like the local fix.
#
# Trigger:
#   - workflow_dispatch  -> "Run workflow" from the Actions tab (pick branch)
#   - push to veux-ci    -> auto build after every push to that branch
#
# Artifacts-first: uploads Image / Image.gz / dtbs + error.log. AnyKernel3
# zip packaging is intentionally NOT wired in yet (needs a custom AK3 with
# vendor_boot support for veux).
# ============================================================================
name: Build veux (SM6375 A17)

on:
  workflow_dispatch:
  push:
    branches: [veux-ci]

env:
  # Matches build_veux.sh
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -O2 -fvisibility=hidden -mcpu=cortex-a76
  KCPPFLAGS: -O2
  # Official LLVM 23.1.0 release — same toolchain as local build_veux.sh
  LLVM_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-Linux-X64.tar.xz
  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: veux 5.4 (Image + Image.gz + dtbs)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout (integrated veux tree, incl. KernelSU submodule + hooks)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # KernelSU (ReSukiSU) pinned via .gitmodules

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev \
            python3 cpio zip xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Free disk space (LLVM 23 is ~12 GB extracted)
        if: env.FREE_MORE_SPACE == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Remove hosted toolcache
        if: env.FREE_MORE_SPACE == 'true'
        shell: bash
        run: sudo rm -rf /opt/hostedtoolcache || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: veux-5.4
          max-size: 2G

      - name: Fetch LLVM 23.1.0 toolchain
        run: |
          curl -fL --retry 3 -o llvm.tar.xz "$LLVM_URL"
          mkdir -p llvm23
          tar -C llvm23 -xf llvm.tar.xz --strip-components=1
          ls llvm23/bin/clang llvm23/bin/ld.lld llvm23/bin/llvm-ar >/dev/null
          # ld.lld needs ICU 70, not shipped on Ubuntu 24.04 — stage the
          # libs into the toolchain's own lib/ (RUNPATH=$ORIGIN/../lib)
          curl -fL -o libicu70.deb http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb
          dpkg -x libicu70.deb icu70
          cp -a icu70/usr/lib/x86_64-linux-gnu/libicu*.so.70* llvm23/lib/
          echo "$GITHUB_WORKSPACE/llvm23/bin" >> "$GITHUB_PATH"
          clang --version | head -1
          ld.lld --version

      - name: Generate .config (veux_defconfig)
        run: |
          make veux_defconfig

      - name: ReSukiSU KALLSYMS_ALL fix + reconcile (non-interactive)
        run: |
          # static_export_check.mk hard-fails without CONFIG_KALLSYMS_ALL=y
          if grep -q "^CONFIG_KSU=y" .config && ! grep -q "^CONFIG_KALLSYMS_ALL=y" .config; then
            sed -i '/^# CONFIG_DEBUG_KERNEL is not set$/d; /^CONFIG_DEBUG_KERNEL=/d; /^CONFIG_KALLSYMS_ALL=/d' .config
            printf '\n# ReSukiSU requirement (CI)\nCONFIG_DEBUG_KERNEL=y\nCONFIG_KALLSYMS_ALL=y\n' >> .config
            echo "[+] Appended DEBUG_KERNEL + KALLSYMS_ALL to .config"
          fi
          make olddefconfig
          grep -E "^CONFIG_(DEBUG_KERNEL|KALLSYMS_ALL|KSU)=" .config

      - name: Build kernel (Image Image.gz dtbs)
        run: |
          set -o pipefail
          make -j"$(nproc)" CC="ccache clang" Image Image.gz dtbs 2>&1 | tee error.log

      - name: Verify ReSukiSU hooks in Image
        run: |
          missing=0
          for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat \
                     ksu_handle_newfstat_ret ksu_handle_fstat64_ret ksu_handle_sys_reboot; do
            if grep -aq "$sym" arch/arm64/boot/Image; then
              echo "  [OK] $sym"
            else
              echo "  [MISSING] $sym"
              missing=1
            fi
          done
          exit $missing

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veux-kernel-Image
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error.log
          path: error.log
